[package]
name = "gipsobob"
version = "0.3.0"
edition = "2024"

[dependencies]
poise = "0.6.2"
tokio = { version = "1.21.2", features = ["full"] }
dotenvy = "0.15"
sqlx = { version = "0.8", features = [ "runtime-tokio", "postgres", "macros", "rust_decimal" ] }
rand = "0.10.1"
log = "0.4"
pretty_env_logger = "0.5"
serde_json = "1.0"
rust_decimal = { version = "1.0", features = ["serde-float"] }
pretty_decimal = "0.2"