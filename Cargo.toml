[package]
name = "gipsobob"
version = "0.2.0"
edition = "2024"

[dependencies]
poise = "0.6.2"
tokio = { version = "1.21.2", features = ["full"] }
dotenvy = "0.15"
sea-orm = { version = "2.0.0-rc.41", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }
rand = "0.10.1"
log = "0.4"
pretty_env_logger = "0.5"
serde_json = "1.0"
pretty_decimal = "0.2"