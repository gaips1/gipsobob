name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -e
            cd /opt/gipsobob

            echo ">>> Pulling latest code..."
            git fetch origin
            git reset --hard origin/master

            echo ">>> Building release..."
            source $HOME/.cargo/env
            cpulimit -l 70 -m -- cargo build --release -j 1

            echo ">>> Copying JSONs..."
            mkdir -p target/release/bot_data
            cp src/modules/fun/kys.json target/release/bot_data/
            cp src/modules/quests/quests.json target/release/bot_data/
            cp src/modules/traits/traits.json target/release/bot_data/

            echo ">>> Restarting service..."
            sudo systemctl restart gipsobob

            echo ">>> Status:"
            sudo systemctl status gipsobob --no-pager
