name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /opt/gipsobob

            echo ">>> Pulling latest code..."
            git fetch origin
            git reset --hard origin/main

            echo ">>> Building release..."
            source $HOME/.cargo/env
            cargo build --release

            echo ">>> Copying JSONs..."
            cp src/modules/fun/kys.json target/release/
            cp src/modules/quests/quests.json target/release/

            echo ">>> Restarting service..."
            sudo systemctl restart gipsobob

            echo ">>> Status:"
            sudo systemctl status gipsobob --no-pager